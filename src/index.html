<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="build-sha" content="%VITE_BUILD_SHA%" />
    <title>모여라 캘린더</title>
    <!-- PWA manifest + icons. Previously present only in the legacy root index.html (not the
         Vite entry actually served by dist/), so the deployed site never linked a manifest at
         all -- beforeinstallprompt/"홈 화면에 추가" had no valid installability signal to fire
         on regardless of browser. See copy-static-to-dist.mjs for how manifest*.json/icons/
         reach dist/. No beforeinstallprompt capture script here on purpose: this app has no
         custom install-prompt UI (see PR #236), so Chromium's own default install affordance
         (address-bar icon / mini-infobar) is left to handle itself undisturbed. -->
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="icon" href="favicon.ico" />
    <meta name="theme-color" content="#4F46E5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="모여라 캘린더" />
    <script>
      // Points the manifest at a per-calendar variant (start_url baked in) so installing while
      // viewing ?id=kkot or ?id=cw launches back into that same calendar -- manifest.json's own
      // start_url has no query string, so without this every installed shortcut would silently
      // open the default calendar regardless of which one was on screen at install time.
      (function () {
        var params = new URLSearchParams(window.location.search);
        var id = params.get('id') || params.get('cal');
        var manifestByCalendar = { kkot: 'manifest-kkot.json', cw: 'manifest-cw.json', jhair: 'manifest-jhair.json' };
        if (id && manifestByCalendar[id]) {
          var link = document.querySelector('link[rel="manifest"]');
          if (link) link.setAttribute('href', manifestByCalendar[id]);
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet" />
    <!-- Same-origin Firebase SDK preload. main.jsx skips these when they are already ready, so
         mobile browsers do not depend on a third-party CDN or duplicate the SDK scripts. -->
    <script src="vendor/firebase-app-compat.js?v=20260828-storage-fix2" defer></script>
    <script src="vendor/firebase-firestore-compat.js?v=20260828-storage-fix2" defer></script>
    <!-- Firebase SDK scripts are loaded from main.jsx (loadFirebaseSdk), vendored under
         vendor/ (same origin) instead of from www.gstatic.com -- a real device consistently got
         `window.firebase undefined` even after every retry/timeout adjustment tried, tracing back
         to something on that network path blocking www.gstatic.com specifically while the site's
         own origin loaded fine. See main.jsx for the loader. -->
    <!-- async, not a plain blocking <script src> (and not defer -- defer scripts still execute in
         document order among the "list of scripts to execute in order" that module scripts belong
         to as well, so a defer script placed here would still make <script type="module"
         src="/main.jsx"> at the bottom of <body> wait for it to finish downloading before running,
         same blocking problem one step removed; measured directly with this app's own boot-ready
         flag). async scripts run independently the moment they're ready, entirely outside that
         ordering, so they can never delay main.jsx. These three are also non-critical (confetti
         effect, lunar-calendar date conversion, QR code generation; every call site already
         guards for the library not being loaded yet), so nothing here needs them before first
         paint or before the app boots -- if jsdelivr.net is ever slow or unreachable for a
         visitor, that no longer holds up Firebase SDK loading or anything else. -->
    <script async src="https://cdn.jsdelivr.net/npm/korean-lunar-calendar/dist/korean-lunar-calendar.min.js"></script>
    <script async src="https://cdn.jsdelivr.net/npm/qrcode-generator@2.0.4/dist/qrcode.js"></script>
  </head>
  <body>
    <div id="root"><div style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;color:#64748B;font-size:0.88rem;">모여라 캘린더 불러오는 중…</div></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
