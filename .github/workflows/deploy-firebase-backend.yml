name: Deploy Firebase backend (manual)

# Cloud Functions / Firestore rules / Storage rules are never deployed implicitly. This workflow
# runs only when started by hand, and deploys only after the emulator test suite passes.
# Requires the repository secret FIREBASE_SERVICE_ACCOUNT (JSON key of a service account with
# Firebase Admin + Cloud Functions Admin + Service Account User roles on metro-live-2918e).
# No --force: if the deploy would delete a function that is missing from source, it stops instead.
on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'firebase deploy --only targets'
        required: true
        default: 'functions'
        type: choice
        options:
          - functions
          - firestore:rules,storage
          - functions,firestore:rules,storage
          - none (data step only)
      post_deploy:
        description: 'After deploying: one-off data step (backup first, then apply)'
        required: false
        default: 'none'
        type: choice
        options:
          - none
          - migrate-photo-comments
          - restore-bulk-deleted-photos-dry-run
          - restore-bulk-deleted-photos
          - restore-memo-files-dry-run
          - restore-memo-files
          - reattach-photo-comments-dry-run
          - reattach-photo-comments
          - merge-duplicate-photos-dry-run
          - merge-duplicate-photos
          - backfill-image-tag-map-dry-run
          - backfill-image-tag-map
          - audit-orphan-storage
          - usage-report
      delete_us_copies:
        description: 'Seoul move (docs/functions-seoul-migration.md): before deploying, delete these us-central1 copies'
        required: false
        default: 'none'
        type: choice
        options:
          - none
          - schedules
          - triggers

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-firebase-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix functions ci
      - name: Emulator tests (gate)
        run: npm run test:functions:emulator
      - name: Deploy
        if: inputs.targets != 'none (data step only)'
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TOUR_API_SERVICE_KEY_SECRET: ${{ secrets.TOUR_API_SERVICE_KEY }}
        run: |
          test -n "$GOOGLE_APPLICATION_CREDENTIALS_JSON" || { echo "FIREBASE_SERVICE_ACCOUNT secret is not set"; exit 1; }
          printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          # functions/index.js declares the optional param TOUR_API_SERVICE_KEY. A non-interactive
          # deploy needs a value, and an empty one would wipe the key the live function already has.
          # Use the TOUR_API_SERVICE_KEY repo secret when set; otherwise carry over the deployed value.
          tour_key="$TOUR_API_SERVICE_KEY_SECRET"
          if [ -z "$tour_key" ]; then
            gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" --quiet >/dev/null 2>&1
            # If the live function cannot be read, stop rather than deploy an empty key over it.
            live=$(gcloud functions describe tourApiSearchProxy --project metro-live-2918e --region us-central1 --format=json 2>"$RUNNER_TEMP/describe.err") \
              || { echo "Could not read the live tourApiSearchProxy config:"; cat "$RUNNER_TEMP/describe.err"; exit 1; }
            tour_key=$(printf '%s' "$live" | jq -r '.environmentVariables.TOUR_API_SERVICE_KEY // .serviceConfig.environmentVariables.TOUR_API_SERVICE_KEY // ""')
          fi
          if [ -n "$tour_key" ]; then echo "::add-mask::$tour_key"; echo "TourAPI key: carried over"; else echo "TourAPI key: none (feature stays off)"; fi
          printf 'TOUR_API_SERVICE_KEY="%s"\n' "$tour_key" > functions/.env.metro-live-2918e
          case "${{ inputs.delete_us_copies }}" in
            schedules) list=functions/seoul-scheduled-functions.txt ;;
            triggers) list=functions/seoul-moved-functions.txt ;;
            *) list= ;;
          esac
          if [ -n "$list" ]; then
            # Only the names in the list, only in us-central1. A name that no longer exists there
            # is skipped, so the step can be re-run.
            existing=$(npx --yes firebase-tools@14 functions:list --project metro-live-2918e --json | jq -r '.result[] | select(.region=="us-central1") | .id')
            names=""
            for name in $(grep -v '^#' "$list"); do
              if printf '%s\n' "$existing" | grep -qx "$name"; then names="$names $name"; fi
            done
            if [ -n "$names" ]; then
              echo "Deleting us-central1 copies:$names"
              # firebase functions:delete also deletes each schedule's Pub/Sub topic, which this
              # service account may not do (403), and then leaves the function in place. gcloud
              # removes the scheduler job and the function only; an orphan topic costs nothing.
              gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" --quiet >/dev/null 2>&1
              for name in $names; do
                gcloud scheduler jobs delete "firebase-schedule-$name-us-central1" --location us-central1 --project metro-live-2918e --quiet 2>/dev/null || true
                gcloud functions delete "$name" --no-gen2 --region us-central1 --project metro-live-2918e --quiet
              done
            else
              echo "No us-central1 copies left to delete from $list"
            fi
          fi
          # Container images of the Seoul functions: a cleanup policy keeps them from piling up.
          # The service account may not be allowed to set it; that only costs a few cents a month.
          npx --yes firebase-tools@14 functions:artifacts:setpolicy --location asia-northeast3 --days 1 --project metro-live-2918e --force \
            || echo "::warning::Could not set the asia-northeast3 cleanup policy (run firebase functions:artifacts:setpolicy --location asia-northeast3 once as an owner)"
          set -o pipefail
          status=0
          npx --yes firebase-tools@14 deploy --project metro-live-2918e --only "${{ inputs.targets }}" --non-interactive 2>&1 | tee "$RUNNER_TEMP/deploy.log" || status=$?
          if [ "$status" -ne 0 ]; then
            # The only failure that is not a failure: every function deployed, the policy did not.
            if grep -q 'Functions successfully deployed but could not set up cleanup policy' "$RUNNER_TEMP/deploy.log" \
              && ! grep -q 'Functions deploy had errors' "$RUNNER_TEMP/deploy.log"; then
              echo "::warning::Deployed; only the asia-northeast3 cleanup policy is missing"
            else
              exit "$status"
            fi
          fi
      # Photo comments v2 (scripts/migrate-photo-comment-items.mjs): back up, report, then copy the
      # old photoComments threads into photoCommentItems. Create-only and safe to repeat; the old
      # collection is left untouched.
      - name: Backup before data step
        if: inputs.post_deploy != 'none'
        run: npm run ops:export -- --dir ops-backups
        env:
          NODE_OPTIONS: --import ./scripts/lib/firestore-anon-auth.mjs
      - name: Keep the backup
        if: inputs.post_deploy != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: pre-${{ inputs.post_deploy }}-backup-${{ github.run_id }}
          path: ops-backups/
          if-no-files-found: error
          retention-days: 90
      - name: Migrate photo comments
        if: inputs.post_deploy == 'migrate-photo-comments'
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          node scripts/migrate-photo-comment-items.mjs
          APPLY=1 node scripts/migrate-photo-comment-items.mjs
      # scripts/restore-bulk-deleted-photos.mjs: photos the 2026-10-02 보관함 bulk delete removed from
      # chat messages and memos come back from the backup taken just before it (artifact of the
      # Daily Calendar Backup run named in the manifest), without sending any push.
      - name: Fetch the pre-delete backup
        if: startsWith(inputs.post_deploy, 'restore-')
        uses: actions/download-artifact@v4
        with:
          run-id: 36977244581
          github-token: ${{ github.token }}
          path: pre-delete-backup
      - name: Restore bulk-deleted photos
        if: startsWith(inputs.post_deploy, 'restore-')
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          MANIFEST: ${{ startsWith(inputs.post_deploy, 'restore-memo-files') && 'scripts/restore-2026-10-03-memo-files.json' || 'scripts/restore-2026-10-02-bulk-delete.json' }}
        run: |
          printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          BACKUP=$(find pre-delete-backup -name 'calendar-prod-backup-*.json' | head -n 1)
          test -n "$BACKUP" || { echo "backup json not found in the artifact"; find pre-delete-backup; exit 1; }
          export BACKUP
          node scripts/restore-bulk-deleted-photos.mjs
          if [ "${{ inputs.post_deploy }}" = "restore-bulk-deleted-photos" ] || [ "${{ inputs.post_deploy }}" = "restore-memo-files" ]; then
            APPLY=1 node scripts/restore-bulk-deleted-photos.mjs
          fi
      # scripts/reattach-photo-comments.mjs: comments filed under a key no photo has go back to
      # the photo they were written on (assetKey only; text and authors stay).
      - name: Re-attach photo comments
        if: startsWith(inputs.post_deploy, 'reattach-photo-comments')
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          node scripts/reattach-photo-comments.mjs
          if [ "${{ inputs.post_deploy }}" = "reattach-photo-comments" ]; then
            APPLY=1 node scripts/reattach-photo-comments.mjs
          fi
      # scripts/merge-duplicate-photos.mjs: byte-identical copies of one photo become one photo
      # (extra copies point at the kept file; tags merged, comments moved, nothing deleted).
      - name: Merge duplicate photos
        if: startsWith(inputs.post_deploy, 'merge-duplicate-photos')
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          node scripts/merge-duplicate-photos.mjs
          if [ "${{ inputs.post_deploy }}" = "merge-duplicate-photos" ]; then
            APPLY=1 node scripts/merge-duplicate-photos.mjs
          fi
      # scripts/backfill-image-tag-map.mjs: positional-only photo tags get keyed by photo too.
      - name: Backfill image tag map
        if: startsWith(inputs.post_deploy, 'backfill-image-tag-map')
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          node scripts/backfill-image-tag-map.mjs
          if [ "${{ inputs.post_deploy }}" = "backfill-image-tag-map" ]; then
            APPLY=1 node scripts/backfill-image-tag-map.mjs
          fi
      # scripts/audit-orphan-storage.mjs: read-only report of Storage files nothing points at.
      - name: Audit orphan Storage files
        if: inputs.post_deploy == 'audit-orphan-storage'
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          node scripts/audit-orphan-storage.mjs
      # scripts/report-firebase-usage.mjs: read-only Cloud Monitoring usage (reads, egress, calls).
      - name: Firebase usage report
        if: inputs.post_deploy == 'usage-report'
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          DAYS=7 node scripts/report-firebase-usage.mjs
