name: Browser Matrix Smoke

# Runs a deterministic local production bundle through each of 3 browsers. Firestore is blocked
# so CORS/availability of the external backend cannot mask a browser regression; the separate
# live-smoke job is the explicit production-data availability check. Weekly (was daily) keeps
# broad rendering coverage without billing reads for every fixture calendar.
on:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * 1'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Build production bundle
        run: npm run build
      - name: Run browser smoke
        env:
          CALENDAR_SMOKE_BROWSER: ${{ matrix.browser }}
          CALENDAR_SMOKE_BLOCK_PRODUCTION_DATA: '1'
        run: npm run smoke:browser
