name: Browser Matrix Smoke

# Loads real production calendar data (kkot/cw/jhair) through a real JS engine in each of 3
# browsers. Weekly (was daily) -- this app has only a couple of active users and near-zero write
# volume, so a full 3-browser pass every single day was pure Firestore-read overhead with no
# corresponding increase in bugs caught. workflow_dispatch still allows an on-demand run any time
# (e.g. right after a risky UI change) without waiting for the weekly schedule.
on:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * 1'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Build production bundle
        run: npm run build
      - name: Run browser smoke
        env:
          CALENDAR_SMOKE_BROWSER: ${{ matrix.browser }}
        run: npm run smoke:browser
