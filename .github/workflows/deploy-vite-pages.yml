name: Deploy Vite Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-vite
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build for GitHub Pages
        run: GITHUB_PAGES=1 npm run build
      - name: Check Vite build output budget
        run: npm run check:dist-budget
      - name: Install Chromium for browser smoke
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke before publishing artifact
        run: |
          for attempt in 1 2 3; do
            npm run smoke:browser && exit 0
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          exit 1
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
