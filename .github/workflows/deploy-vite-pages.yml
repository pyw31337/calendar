name: Deploy Vite Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pages-vite
  # Keep the newest run queued; never cancel a build that may be publishing the site.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build for GitHub Pages
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
        run: GITHUB_PAGES=1 npm run build
      - name: Check Vite build output budget
        run: npm run check:dist-budget
      - name: Install Chromium for browser smoke
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke before publishing artifact
        # The deploy gate covers every calendar's core routes plus representative desktop/mobile
        # interactions. The exhaustive 3-engine matrix remains a local release gate; running all
        # 94 production-data checks serially on a hosted runner can delay publication by 15+ min.
        env:
          CALENDAR_SMOKE_SCOPE: deploy
          CALENDAR_SMOKE_BASE_PATH: /calendar/
        run: |
          # Hosted runners occasionally delay a mobile route transition even
          # though the build and the route are healthy. Retry the complete
          # read-only gate a small, bounded number of times; deterministic
          # failures still stop publication after the final attempt.
          for attempt in 1 2 3; do
            echo "[deploy-smoke] attempt ${attempt}/3"
            if npm run smoke:browser; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo "[deploy-smoke] transient smoke failure; retrying after runner cool-down"
              sleep 5
            fi
          done
          echo "[deploy-smoke] browser smoke failed after 3 attempts"
          exit 1
      # Published straight to the gh-pages branch root (rather than the actions/deploy-pages
      # artifact flow) so that PR previews -- deployed by pr-preview.yml to gh-pages under
      # pr-preview/pr-<n>/ via the same mechanism -- can coexist on one Pages site instead of
      # each full deploy replacing the other. Also: an actions/deploy-pages deployment silently
      # flips the repo's Pages source setting back to "GitHub Actions" the moment it succeeds --
      # confirmed the hard way (2026-09-05: an unrelated PR merge re-ran the old version of this
      # workflow, which flipped Pages source back and made every live PR preview 404 until this
      # workflow itself stopped using it). Publishing to the branch directly never touches that
      # setting, so once Settings -> Pages is set to "Deploy from a branch: gh-pages" it stays
      # that way. keep_files: true is what makes root/preview coexistence possible: without it,
      # actions-gh-pages force-orphans the branch on every push and would wipe out any live PR
      # preview folders on the next production deploy.
      # peaceiris/actions-gh-pages clones gh-pages once and pushes. PR preview
      # jobs publish the same branch at the same time, so that push is rejected
      # ("fetch first") and the whole deploy goes red even though the build is
      # fine. Publish here with a fresh clone on every attempt.
      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          for attempt in 1 2 3 4 5; do
            echo "[publish] attempt ${attempt}/5"
            dir=$(mktemp -d)
            if ! git clone --depth=1 --single-branch --branch gh-pages \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$dir"; then
              echo "[publish] clone failed"
              rm -rf "$dir"
              sleep $((attempt * 3))
              continue
            fi
            # Overlay the production build. Keep pr-preview/ and older hashed
            # assets (same contract as peaceiris keep_files: true).
            cp -a dist/. "$dir/"
            rm -rf "$dir/.github"
            touch "$dir/.nojekyll"
            git -C "$dir" add --all
            if git -C "$dir" diff --cached --quiet; then
              echo "[publish] already up to date"
              rm -rf "$dir"
              exit 0
            fi
            if ! git -C "$dir" -c user.name='github-actions[bot]' \
              -c user.email='github-actions[bot]@users.noreply.github.com' \
              commit -m "deploy: production build from ${DEPLOY_SHA}"; then
              echo "[publish] commit failed"
              rm -rf "$dir"
              sleep $((attempt * 3))
              continue
            fi
            if git -C "$dir" push origin HEAD:gh-pages; then
              echo "[publish] pushed"
              rm -rf "$dir"
              exit 0
            fi
            echo "[publish] push rejected; another job updated gh-pages"
            rm -rf "$dir"
            sleep $((attempt * 3))
          done
          echo "[publish] failed after 5 attempts"
          exit 1
