name: Deploy Vite Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pages-vite
  # Keep the newest run queued; never cancel a build that may be publishing the site.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build for GitHub Pages
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
        run: GITHUB_PAGES=1 npm run build
      - name: Check Vite build output budget
        run: npm run check:dist-budget
      - name: Install Chromium for browser smoke
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke before publishing artifact
        # The deploy gate covers every calendar's core routes plus representative desktop/mobile
        # interactions. The exhaustive 3-engine matrix remains a local release gate; running all
        # 94 production-data checks serially on a hosted runner can delay publication by 15+ min.
        env:
          CALENDAR_SMOKE_SCOPE: deploy
          CALENDAR_SMOKE_BASE_PATH: /calendar/
        run: |
          npm run smoke:browser
      # Published straight to the gh-pages branch root (rather than the actions/deploy-pages
      # artifact flow) so that PR previews -- deployed by pr-preview.yml to gh-pages under
      # pr-preview/pr-<n>/ via the same mechanism -- can coexist on one Pages site instead of
      # each full deploy replacing the other. Also: an actions/deploy-pages deployment silently
      # flips the repo's Pages source setting back to "GitHub Actions" the moment it succeeds --
      # confirmed the hard way (2026-09-05: an unrelated PR merge re-ran the old version of this
      # workflow, which flipped Pages source back and made every live PR preview 404 until this
      # workflow itself stopped using it). Publishing to the branch directly never touches that
      # setting, so once Settings -> Pages is set to "Deploy from a branch: gh-pages" it stays
      # that way. keep_files: true is what makes root/preview coexistence possible: without it,
      # actions-gh-pages force-orphans the branch on every push and would wipe out any live PR
      # preview folders on the next production deploy.
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy: production build from ${{ github.sha }}'
