name: Apply V2 notification permission help

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: Branch to apply the fix onto
        required: true
        default: fix/v2-notification-permission-help

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0

      - name: Surgical remount of NotificationPermissionHelpModal
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          main = Path('src/core/app-main.js')
          text = main.read_text()
          old = '{ chatUploadProgress, operationProgress, toast, dismissToast, confirmDialog, setConfirmDialog }'
          new = '{ chatUploadProgress, operationProgress, toast, dismissToast, confirmDialog, setConfirmDialog, isNotificationHelpOpen, setIsNotificationHelpOpen, onNotificationHelpRetry: handleMainToggleNotifications, showToast }'
          if new in text:
              print('app-main.js: already wired')
          elif old not in text:
              raise SystemExit('app-main.js: overlay object marker not found')
          else:
              idx = text.rfind(old)
              main.write_text(text[:idx] + new + text[idx+len(old):])
              print('app-main.js: wired')

          shell_path = Path('src/ui/ui-app-shell-v2.js')
          shell = shell_path.read_text()

          prop_old = '''    confirmDialog: globalOverlays?.confirmDialog || null,\n    setConfirmDialog: globalOverlays?.setConfirmDialog || null,\n  });'''
          prop_new = '''    confirmDialog: globalOverlays?.confirmDialog || null,\n    setConfirmDialog: globalOverlays?.setConfirmDialog || null,\n    isNotificationHelpOpen: globalOverlays?.isNotificationHelpOpen || false,\n    setIsNotificationHelpOpen: globalOverlays?.setIsNotificationHelpOpen || null,\n    onNotificationHelpRetry: globalOverlays?.onNotificationHelpRetry || null,\n    showToast: globalOverlays?.showToast || null,\n  });'''
          # Fix escaped newlines from YAML - use real newlines
          prop_old = prop_old.replace('\\n', '\n') if '\\\\n' in prop_old else '''    confirmDialog: globalOverlays?.confirmDialog || null,
    setConfirmDialog: globalOverlays?.setConfirmDialog || null,
  });'''
          prop_new = '''    confirmDialog: globalOverlays?.confirmDialog || null,
    setConfirmDialog: globalOverlays?.setConfirmDialog || null,
    isNotificationHelpOpen: globalOverlays?.isNotificationHelpOpen || false,
    setIsNotificationHelpOpen: globalOverlays?.setIsNotificationHelpOpen || null,
    onNotificationHelpRetry: globalOverlays?.onNotificationHelpRetry || null,
    showToast: globalOverlays?.showToast || null,
  });'''
          if 'isNotificationHelpOpen: globalOverlays' in shell:
              print('shell props: already wired')
          elif prop_old not in shell:
              raise SystemExit('shell: globalOverlays confirmDialog marker not found')
          else:
              shell = shell.replace(prop_old, prop_new, 1)
              print('shell props: wired')

          sig_old = 'export function RenewalAppShell({ activeCalId, calendar, moreContext, calendarContext, chatContext, settlementContext, recordsContext, chatUploadProgress, operationProgress, toast, dismissToast, confirmDialog, setConfirmDialog }) {'
          sig_new = 'export function RenewalAppShell({ activeCalId, calendar, moreContext, calendarContext, chatContext, settlementContext, recordsContext, chatUploadProgress, operationProgress, toast, dismissToast, confirmDialog, setConfirmDialog, isNotificationHelpOpen, setIsNotificationHelpOpen, onNotificationHelpRetry, showToast }) {'
          if 'onNotificationHelpRetry, showToast }) {' in shell:
              print('shell signature: already wired')
          elif sig_old not in shell:
              raise SystemExit('shell: RenewalAppShell signature marker not found')
          else:
              shell = shell.replace(sig_old, sig_new, 1)
              print('shell signature: wired')

          mount_old = '''    confirmDialog && React.createElement(bindUiComponentAliases(React).ConfirmDialog, {
      title: confirmDialog.title,
      message: confirmDialog.message,
      onConfirm: confirmDialog.onConfirm,
      onCancel: () => { if (typeof setConfirmDialog === \'function\') setConfirmDialog(null); },
      showPasswordInput: confirmDialog.showPasswordInput,
      alertOnly: confirmDialog.alertOnly,
    })
  );
}'''
          # Use exact mount from repo (verified against clone)
          mount_old = """    confirmDialog && React.createElement(bindUiComponentAliases(React).ConfirmDialog, {
      title: confirmDialog.title,
      message: confirmDialog.message,
      onConfirm: confirmDialog.onConfirm,
      onCancel: () => { if (typeof setConfirmDialog === 'function') setConfirmDialog(null); },
      showPasswordInput: confirmDialog.showPasswordInput,
      alertOnly: confirmDialog.alertOnly,
    })
  );
}"""
          mount_new = """    confirmDialog && React.createElement(bindUiComponentAliases(React).ConfirmDialog, {
      title: confirmDialog.title,
      message: confirmDialog.message,
      onConfirm: confirmDialog.onConfirm,
      onCancel: () => { if (typeof setConfirmDialog === 'function') setConfirmDialog(null); },
      showPasswordInput: confirmDialog.showPasswordInput,
      alertOnly: confirmDialog.alertOnly,
    }),
    // Same reason as ConfirmDialog/toast: v2 returns before app-main's withStickyVideo(),
    // which is where NotificationPermissionHelpModal used to mount. openNotificationHelp()
    // (wired into AppSettings / GlobalSearch already) flips isNotificationHelpOpen, but
    // without this remount nothing renders under ?shell=v2.
    // Note: NotificationOnboardingModal is intentionally NOT remounted -- setIsNotifOnboardingOpen(true)
    // has no callers (onboarding is dead); permission-help alone unblocks the cutover checklist.
    isNotificationHelpOpen && React.createElement(bindUiComponentAliases(React).NotificationPermissionHelpModal, {
      onClose: () => { if (typeof setIsNotificationHelpOpen === 'function') setIsNotificationHelpOpen(false); },
      onRetry: onNotificationHelpRetry,
      showToast,
    })
  );
}"""
          if 'NotificationPermissionHelpModal' in shell and 'isNotificationHelpOpen && React.createElement' in shell:
              print('shell mount: already wired')
          elif mount_old not in shell:
              raise SystemExit('shell: ConfirmDialog mount marker not found')
          else:
              shell = shell.replace(mount_old, mount_new, 1)
              print('shell mount: wired')

          shell_path.write_text(shell)

          test_path = Path('test/v2-routing.test.mjs')
          test = test_path.read_text()
          test_old = "assert.match(appMain, /renderRenewalShellIfEnabled\\([\\s\\S]*?\\bconfirmDialog,\\s*setConfirmDialog\\s*\\}/, 'CalendarApp must also pass confirmDialog into the v2 shell (anniversary delete etc.)');"
          test_mid = "assert.match(appMain, /renderRenewalShellIfEnabled\\([\\s\\S]*?\\bconfirmDialog,\\s*setConfirmDialog\\b/, 'CalendarApp must also pass confirmDialog into the v2 shell (anniversary delete etc.)');"
          if "V2 shell mounts NotificationPermissionHelpModal like v1" in test:
              print('test: already present')
          else:
              if test_old in test:
                  test = test.replace(test_old, test_mid, 1)
              elif test_mid not in test:
                  # show nearby for debug
                  raise SystemExit('test: confirmDialog assert marker not found')
              needle = "assert.match(shell, /ConfirmDialog/, 'RenewalAppShell must mount ConfirmDialog when confirmDialog is set');\n});"
              if needle not in test:
                  raise SystemExit('test: toast-test closing marker not found')
              extra = '''

// Regression: NotificationPermissionHelpModal also lived only in withStickyVideo() /
// sharedAppOverlays. V2 already wires openNotificationHelp into AppSettings / GlobalSearch,
// but without remounting the modal, isNotificationHelpOpen updates with nothing on screen.
// Permission-help only -- NotificationOnboardingModal is dead (setIsNotifOnboardingOpen(true)
// has no callers) and is intentionally not revived here.
test('V2 shell mounts NotificationPermissionHelpModal like v1', async () => {
  const { readFileSync } = await import('node:fs');
  const shell = readFileSync(new URL('../src/ui/ui-app-shell-v2.js', import.meta.url), 'utf8');
  const appMain = readFileSync(new URL('../src/core/app-main.js', import.meta.url), 'utf8');
  assert.match(shell, /isNotificationHelpOpen/, 'RenewalAppShell must accept isNotificationHelpOpen as a prop');
  assert.match(shell, /NotificationPermissionHelpModal/, 'RenewalAppShell must mount NotificationPermissionHelpModal when help is open');
  assert.match(appMain, /renderRenewalShellIfEnabled\\([\\s\\S]*?\\bisNotificationHelpOpen,\\s*setIsNotificationHelpOpen\\b/, 'CalendarApp must pass notification-help open state into the v2 shell');
  assert.match(appMain, /onNotificationHelpRetry:\\s*handleMainToggleNotifications/, 'CalendarApp must pass handleMainToggleNotifications as onNotificationHelpRetry');
  assert.doesNotMatch(shell, /createElement\\([^)]*NotificationOnboardingModal/, 'Do not revive dead NotificationOnboardingModal on v2 (no setIsNotifOnboardingOpen(true) callers)');
});
'''
              test_path.write_text(test.replace(needle, needle + extra, 1))
              print('test: added')

          import subprocess
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True)
          print('changed:', changed)
          for line in changed.splitlines():
              if line.endswith('.css') and '/v2/' in line:
                  raise SystemExit('forbidden css: ' + line)
              if 'visual-viewport' in line or 'viewport-shell' in line or 'feature-flag' in line:
                  raise SystemExit('forbidden file: ' + line)
          print('OK')
          PY

      - name: Run V2 routing tests
        run: node --test test/v2-routing.test.mjs test/v2-scrollport.test.mjs

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/core/app-main.js src/ui/ui-app-shell-v2.js test/v2-routing.test.mjs
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m "$(cat <<'MSG'
          fix(v2): remount NotificationPermissionHelpModal in RenewalAppShell

          V2 returned before withStickyVideo()/sharedAppOverlays, so openNotificationHelp()
          updated isNotificationHelpOpen with nothing to render. Wire the same overlay
          through globalOverlays (like toast/ConfirmDialog) to unblock the cutover
          checklist item without touching dark-token CSS or shell defaults.
          MSG
          )"
          git push origin HEAD:${{ inputs.target_branch }}
