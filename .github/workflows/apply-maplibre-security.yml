name: Apply MapLibre security patch

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply gzip+hex patch
        run: python3 patches/apply-maplibre-security.py
      - name: Remove one-shot apply artifacts
        run: |
          rm -f patches/maplibre-security.patch patches/apply-maplibre-security.py
          rm -f patches/maplibre-security.hex patches/maplibre-security-*.hex
          rmdir patches 2>/dev/null || true
          rm -f .github/workflows/apply-maplibre-security.yml
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'fix(security): upgrade maplibre-gl 5.7.1 to 6.9.0 (CVE-2026-85061)'
          git push
