name: Daily Live Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Live smoke
        run: npm run smoke:live
      - name: Firestore operations audit
        run: npm run ops:audit
      # Full pagination scan of every message/memo/meeting doc across all 3 calendars -- real
      # Firestore read cost, unlike the two cheap steps above. Only a handful of people ever use
      # this app, so broken media links are not going to pile up hour-to-hour; weekly (Mondays,
      # or any manual workflow_dispatch run) is enough to catch a regression without paying for
      # a full-history scan every single day.
      - name: Media integrity audit
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%u)" = "1" ]; then
            npm run ops:media-audit
          else
            echo "Skipping media audit -- runs weekly on Mondays (UTC), today is not Monday."
          fi
        continue-on-error: true
