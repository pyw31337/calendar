name: Verify Calendar

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run safety tests
        run: npm run safety:test
      - name: Static design and isolation guards
        run: npm run check:all
      - name: Check tab wiring
        run: npm run check:tab-wiring
      - name: Check size budget
        run: npm run check:size-budget
      - name: Build
        run: npm run build

  live-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Wait for Pages (brief)
        run: sleep 30
      - name: Live smoke
        run: npm run smoke:live
        continue-on-error: true
