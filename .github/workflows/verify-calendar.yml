name: Verify Calendar

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run safety tests
        run: npm run safety:test
      - name: Run restore rehearsal
        run: npm run restore:rehearsal
      - name: Static design and isolation guards
        run: npm run check:all
      - name: Verify fixed places/settlement/map regression scenarios
        run: npm run check:ci-scenarios
      - name: Build
        run: npm run build
      - name: Check Vite build output budget
        run: npm run check:dist-budget

  # Firestore/Storage rules and Cloud Functions tests against the emulators -- the same suite
  # the manual backend deploy is gated on, run on every PR so a rules regression shows up
  # before merge instead of at deploy time.
  emulator-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Setup Java (Firestore emulator)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix functions ci
      - name: Emulator tests
        run: npm run test:functions:emulator

  live-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: verify
    # A production URL can occasionally stall at the network layer. This is observational only,
    # so surface the problem but never consume an unbounded hosted runner.
    timeout-minutes: 7
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Wait for Pages (brief)
        run: sleep 30
      - name: Live smoke
        run: npm run smoke:live
        continue-on-error: true
        timeout-minutes: 6
        env:
          NODE_OPTIONS: --import ./scripts/lib/firestore-anon-auth.mjs
          EXPECTED_BUILD_SHA: ${{ github.sha }}
