name: Culture Performances Daily Sync

# Pulls the culture-portal+kopis, festival, and sports (야구/축구/농구/배구/핸드볼) slices of
# Culture Flow's public performances feed once a day and commits normalized snapshots to
# public-vite/data/culture-performances.json, public-vite/data/culture-festivals.json, and
# public-vite/data/culture-sports.json. See scripts/sync-culture-performances.mjs for why this
# never touches any of these files on a failed/suspicious fetch (Culture Flow is a separate
# project we don't control the release cadence of).

on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *' # 01:00 KST -- after Culture Flow's own 00:00 KST data refresh

permissions:
  contents: write

concurrency:
  group: culture-sync-daily
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Sync culture performances snapshot
        run: node scripts/sync-culture-performances.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- public-vite/data/culture-performances.json public-vite/data/culture-festivals.json public-vite/data/culture-sports.json; then
            echo "No change in culture performances/festivals/sports snapshots."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public-vite/data/culture-performances.json public-vite/data/culture-festivals.json public-vite/data/culture-sports.json
          git commit -m "chore: daily culture performances/festivals/sports snapshot sync"
          git push
