name: Apply gallery thumbs back-nav fix
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v2-gallery-thumbs-back-nav
          fetch-depth: 0
      - name: Apply diffs and push
        run: |
          set -euo pipefail
          git config user.name "pyw31337"
          git config user.email "pyw31337@users.noreply.github.com"
          if [ -f patches/fix-ui-app-shell-v2.diff.a1 ]; then
            cat patches/fix-ui-app-shell-v2.diff.a1 patches/fix-ui-app-shell-v2.diff.a2 \
                patches/fix-ui-app-shell-v2.diff.b1 patches/fix-ui-app-shell-v2.diff.b2 \
              > patches/fix-ui-app-shell-v2.diff
          elif [ -f patches/fix-ui-app-shell-v2.diff.a ]; then
            cat patches/fix-ui-app-shell-v2.diff.a patches/fix-ui-app-shell-v2.diff.b > patches/fix-ui-app-shell-v2.diff
          fi
          for f in patches/fix-ui-app-shell-v2.diff \
                   patches/fix-ui-chat-gallery.diff \
                   patches/fix-ui-summary-gallery.diff \
                   patches/fix-aurora-theme.diff \
                   patches/fix-v2-routing-test.diff; do
            echo "Applying $f"
            git apply --check "$f"
            git apply "$f"
          done
          rm -f patches/fix-*.diff patches/fix-*.diff.a* patches/fix-*.diff.b* \
                patches/gallery-thumbs-back-nav.b64.* \
                .github/workflows/apply-gallery-thumbs-fix.yml
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "$(cat <<'MSG'
fix(v2): redesign gallery thumb resolver and stop records-hub Back

Home + gallery share resolveGalleryThumbUrl; skip 404/tombstone rows;
skeleton while photoIndex loads; V2 nav writes one history entry so Back
never lands on the records hub.
MSG
)"
          git push origin HEAD:fix/v2-gallery-thumbs-back-nav
