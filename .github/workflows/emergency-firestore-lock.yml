name: Apply Emergency Firestore Repair

on:
  push:
    paths:
      - '.github/workflows/emergency-firestore-lock.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch persistence safety deterministically
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          def replace_between(source, start_marker, end_marker, replacement, label):
              start = source.find(start_marker)
              if start < 0:
                  raise SystemExit(f'{label}: start marker not found')
              end = source.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f'{label}: end marker not found')
              print(f'{label}: replacing bytes {start}..{end}')
              return source[:start] + replacement + source[end:]

          old_flags = (
              "const ENABLE_FIRESTORE_SYNC = true; // Firestore is the only production source of truth\n"
              "const ENABLE_FIRESTORE_WRITES = false; // EMERGENCY READ-ONLY MODE during recovery"
          )
          new_flags = (
              "const IS_LOCAL_TEST_MODE = new URLSearchParams(window.location.search).get('storage') === 'local';\n"
              "const ENABLE_FIRESTORE_SYNC = !IS_LOCAL_TEST_MODE; // Firestore is the only production source of truth\n"
              "const ENABLE_FIRESTORE_WRITES = !IS_LOCAL_TEST_MODE;"
          )
          if old_flags not in text:
              raise SystemExit('mode flags: exact current block not found')
          text = text.replace(old_flags, new_flags, 1)
          print('mode flags: patched')

          settings_fn = '''function replaceCalendarSettings(serverCalendar, incomingCalendar) {
  const server = cloneCalendar(serverCalendar) || {};
  const incoming = cloneCalendar(incomingCalendar) || {};
  if (!server.id || !incoming.id || server.id !== incoming.id) {
    throw new Error('Calendar ID mismatch during settings save');
  }

  const participantMap = new Map();
  (server.participants || []).forEach(participant => {
    if (participant?.id) participantMap.set(participant.id, cloneParticipant(participant));
  });
  (incoming.participants || []).forEach(participant => {
    if (!participant?.id) return;
    participantMap.set(
      participant.id,
      mergeParticipantRecord(participantMap.get(participant.id), participant)
    );
  });

  return {
    ...server,
    title: incoming.title || server.title,
    description: incoming.description ?? server.description,
    participants: Array.from(participantMap.values()),
    // Settings never delete or rewrite schedule records.
    availabilities: (server.availabilities || []).map(cloneAvailability),
    updatedAt: Math.max(server.updatedAt || 0, incoming.updatedAt || 0),
    revision: Math.max(server.revision || 0, incoming.revision || 0) + 1
  };
}

'''
          text = replace_between(
              text,
              'function replaceCalendarSettings(serverCalendar, incomingCalendar) {',
              'function cloneCalendar(calendar) {',
              settings_fn,
              'replaceCalendarSettings'
          )

          old_admin = '''      const stampedCal = pruneAvailabilitiesForParticipantSettings({
        ...updatedCal,
        updatedAt: now,
        revision: (updatedCal.revision || 0) + 1,
        participants: stampParticipantSettings(updatedCal.participants, now)
      }, now);'''
          new_admin = '''      const stampedCal = {
        ...updatedCal,
        updatedAt: now,
        revision: (updatedCal.revision || 0) + 1,
        participants: stampParticipantSettings(updatedCal.participants, now),
        // Preserve schedules exactly as loaded from the active calendar.
        availabilities: (activeCal.availabilities || []).map(cloneAvailability)
      };'''
          if old_admin not in text:
              raise SystemExit('admin save: exact current block not found')
          text = text.replace(old_admin, new_admin, 1)
          print('admin save: patched')

          writer_fn = '''async function pushSingleCloudCalendar(targetCal, lastModified, retryCount = 3, allCalendars = null, saveMode = 'availability') {
  const normalizedCal = normalizeCalendarForSave(targetCal);
  if (!normalizedCal || !normalizedCal.id) return false;
  if (!ENABLE_FIRESTORE_SYNC) return true; // local regression-test mode only
  if (!ENABLE_FIRESTORE_WRITES || !firebaseDb) return false;

  try {
    const ref = firebaseDb.collection('calendars').doc(`cal_${normalizedCal.id}`);
    const historyRef = firebaseDb.collection('calendar_history').doc(
      `${normalizedCal.id}_${lastModified}_${Math.random().toString(36).slice(2, 8)}`
    );

    await Promise.race([
      firebaseDb.runTransaction(async tx => {
        const snap = await tx.get(ref);
        const currentData = snap.exists && snap.data() ? snap.data() : null;
        const serverCalendar = currentData?.calendar || null;

        if (serverCalendar?.id && serverCalendar.id !== normalizedCal.id) {
          throw new Error('Refused cross-calendar write');
        }

        let nextCalendar;
        if (!serverCalendar) {
          nextCalendar = normalizedCal;
        } else if (saveMode === 'replace') {
          throw new Error('Refused replacement of an existing calendar');
        } else if (saveMode === 'settings') {
          nextCalendar = replaceCalendarSettings(serverCalendar, normalizedCal);
        } else {
          nextCalendar = mergeCalendarAvailabilityDelta(serverCalendar, normalizedCal, lastModified);
        }

        const mergedCalendar = normalizeCalendarForSave(nextCalendar);
        if (!mergedCalendar || mergedCalendar.id !== normalizedCal.id) {
          throw new Error('Calendar identity validation failed');
        }

        if (serverCalendar) {
          tx.set(historyRef, {
            calendarId: normalizedCal.id,
            calendar: cloneCalendar(serverCalendar),
            savedAt: lastModified,
            saveMode,
            previousRevision: currentData?.revision || serverCalendar.revision || 0
          });
        }

        tx.set(ref, {
          calendar: mergedCalendar,
          lastModified,
          revision: Math.max(currentData?.revision || 0, mergedCalendar.revision || 0) + 1
        });
      }),
      new Promise((_, reject) => setTimeout(() => reject(new Error('Firestore push timeout')), 8000))
    ]);
    return true;
  } catch (e) {
    console.error(`Firestore save failed for cal_${normalizedCal.id}:`, e);
    return false;
  }
}
'''
          text = replace_between(
              text,
              "async function pushSingleCloudCalendar(targetCal, lastModified, retryCount = 3, allCalendars = null, saveMode = 'availability') {",
              'function loadLocalMeta() {',
              writer_fn,
              'pushSingleCloudCalendar'
          )

          cache_fn = '''function saveLocalCache(data) {
  // Calendar data is never persisted locally in production.
  if (IS_LOCAL_TEST_MODE) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
  }
}

'''
          text = replace_between(
              text,
              'function saveLocalCache(data) {',
              '// Firebase Config for Realtime Multi-User Cloud Sync',
              cache_fn,
              'saveLocalCache'
          )

          # Prevent production fallback writes to JSONBlob. Firestore is the sole source of truth.
          master_start = text.find('async function pushMasterCloudCalendars(')
          master_end = text.find('// Pushes isolated calendar data', master_start)
          if master_start < 0 or master_end < 0:
              raise SystemExit('pushMasterCloudCalendars markers not found')
          master_fn = '''async function pushMasterCloudCalendars(nextCalendars, lastModified, retryCount = 4) {
  if (!IS_LOCAL_TEST_MODE) return false;
  return false;
}

'''
          text = text[:master_start] + master_fn + text[master_end:]
          print('JSONBlob production writer: disabled')

          path.write_text(text, encoding='utf-8')
          print('index.html written')
          PY

      - name: Validate repaired source
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          required = [
            'Refused cross-calendar write',
            "collection('calendar_history')",
            'Settings never delete or rewrite schedule records.',
            'Calendar data is never persisted locally in production.',
            'Refused replacement of an existing calendar',
          ]
          for item in required:
            assert item in text, item
          assert 'const stampedCal = pruneAvailabilitiesForParticipantSettings' not in text
          assert 'const ENABLE_FIRESTORE_WRITES = false' not in text
          print('Emergency persistence checks passed')
          PY

      - name: Commit repaired application
        run: |
          git status --short
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Repair isolated Firestore persistence and add history backups"
          git push origin HEAD:main
