name: Emergency Firestore Write Lock

on:
  push:
    paths:
      - '.github/workflows/emergency-firestore-lock.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock-writes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Disable all production Firestore writes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = "const ENABLE_FIRESTORE_SYNC = new URLSearchParams(window.location.search).get('storage') !== 'local';"
          new = "const ENABLE_FIRESTORE_SYNC = false; // EMERGENCY LOCK: prevent any Firestore read/write until recovery is complete"
          if old not in text and new not in text:
              raise SystemExit('Expected Firestore switch not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit emergency lock
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Emergency lock Firestore writes"
          git push
