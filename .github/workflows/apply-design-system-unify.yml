name: Apply design-system unify

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply patch, drop one-shot files, push
        run: |
          python3 - <<'PY'
          import gzip, hashlib, pathlib, sys
          parts = sorted(pathlib.Path('patches').glob('ds-unify-*.hex'))
          hexdata = ''.join(''.join(p.read_text().split()) for p in parts)
          if len(hexdata) != 26054:
              print('hexlen', len(hexdata), file=sys.stderr)
              sys.exit(1)
          patch = gzip.decompress(bytes.fromhex(hexdata))
          digest = hashlib.sha256(patch).hexdigest()
          if digest != '190c2531124da9b74f9ae9d1cd46fa86ffc17e3411f3dceb4b83e6410714f88f':
              print('bad sha256', digest, file=sys.stderr)
              sys.exit(1)
          pathlib.Path('/tmp/fix.patch').write_bytes(patch)
          print('patch ok', len(patch), digest)
          PY
          git apply /tmp/fix.patch
          rm -f .github/workflows/apply-design-system-unify.yml
          rm -rf patches
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "ui: unify edit checkboxes, page headers, and list toolbars"
          git push
