name: Apply gallery button ratio fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply patch, drop one-shot files, push
        run: |
          python3 - <<'PY'
          import base64, gzip, pathlib
          raw = pathlib.Path('patches/gallery-button-ratio.b64').read_text()
          pathlib.Path('/tmp/fix.patch').write_bytes(gzip.decompress(base64.b64decode(raw)))
          PY
          git apply /tmp/fix.patch
          rm -f .github/workflows/apply-gallery-button-ratio.yml patches/gallery-button-ratio.b64
          rmdir patches 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "ui(gallery): hide all/date in edit mode; keep action buttons at least 1:1"
          git push
