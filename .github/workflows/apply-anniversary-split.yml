name: Apply anniversary split

on:
  push:
    branches: [refactor/split-anniversary-dates]
    paths:
      - 'patches/apply-split-anniversary.py'

permissions:
  contents: write

concurrency:
  group: apply-anniversary-split
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'extract anniversary date matching') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply extraction, drop seed files, push
        run: |
          set -euo pipefail
          python3 patches/apply-split-anniversary.py
          rm -f patches/apply-split-anniversary.py patches/split-anniversary-dates.patch
          rm -f .github/workflows/apply-anniversary-split.yml
          rmdir patches 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "refactor: extract anniversary date matching from app-main"
          git push
