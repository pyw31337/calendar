name: Daily Calendar Backup

on:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * *'

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Export production calendar backup
        run: npm run ops:export -- --dir ops-backups
      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: calendar-backup-${{ github.run_id }}
          path: ops-backups/
          if-no-files-found: error
          retention-days: 90
