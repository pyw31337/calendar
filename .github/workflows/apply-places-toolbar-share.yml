name: Apply places toolbar share

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply patch, drop one-shot files, push
        run: |
          python3 patches/apply.py
          git apply /tmp/fix.patch
          rm -f .github/workflows/apply-places-toolbar-share.yml patches/apply.py patches/p1.hex patches/p2.hex patches/p3.hex patches/p4.hex patches/p5.hex patches/p6.hex patches/p7.hex patches/p8.hex patches/places-toolbar-share.hex patches/places-toolbar-share.b64
          rmdir patches 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "ui(places): list toolbar + safe bulk share; restyle memory-add plus"
          git push
