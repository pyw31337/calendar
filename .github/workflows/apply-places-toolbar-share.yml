name: Apply places toolbar share

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply patch, drop one-shot files, push
        run: |
          python3 - <<'PY'
          import base64, gzip, pathlib
          raw = pathlib.Path('patches/places-toolbar-share.b64').read_text()
          pathlib.Path('/tmp/fix.patch').write_bytes(gzip.decompress(base64.b64decode(raw)))
          PY
          git apply /tmp/fix.patch
          rm -f .github/workflows/apply-places-toolbar-share.yml patches/places-toolbar-share.b64
          rmdir patches 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "ui(places): list toolbar + safe bulk share; restyle memory-add plus"
          git push
