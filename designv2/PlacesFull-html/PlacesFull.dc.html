<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root {
      --bg-primary: #FAFAFC; --bg-card: #FFFFFF; --border-subtle: #ECEAF5;
      --text-main: #1E1B2E; --text-muted: #6B6580; --text-light: #83798F;
      --brand: #7C3AED; --brand-soft: #F3EEFF;
      --radius-lg: 18px; --radius-md: 12px; --radius-sm: 8px; --radius-full: 9999px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif; background: var(--bg-primary); }
    button, input { font-family: inherit; }

    .app-shell { width: 100%; max-width: 480px; margin: 0 auto; background: var(--bg-primary); min-height: 100%; }

    .header { position: sticky; top: 0; background: var(--bg-card); z-index: 5; padding: 12px 14px 10px; border-bottom: 1px solid var(--border-subtle); }
    .header-row { display: flex; align-items: center; gap: 8px; }
    .back-btn { background: none; border: none; color: var(--text-main); cursor: pointer; padding: 4px; display: inline-flex; }
    .header-title { font-weight: 800; font-size: 0.96rem; color: var(--text-main); }
    .header-count { font-size: 0.64rem; color: var(--text-light); font-weight: 700; margin-left: 4px; }
    .header-actions { margin-left: auto; display: flex; gap: 4px; }
    .icon-btn { background: none; border: none; color: var(--text-muted); padding: 7px; display: inline-flex; cursor: pointer; border-radius: var(--radius-full); }
    .icon-btn:hover { background: var(--bg-primary); color: var(--brand); }
    .fab { position: fixed; right: 20px; bottom: 24px; width: 52px; height: 52px; border-radius: 50%; background: var(--brand); color: #fff; border: none; box-shadow: 0 8px 20px rgba(124,58,237,0.35); display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 6; }

    .search-row { margin-top: 10px; position: relative; }
    .search-input { width: 100%; border: 1px solid var(--border-subtle); border-radius: var(--radius-full); padding: 9px 14px 9px 34px; font-size: 0.78rem; background: var(--bg-primary); color: var(--text-main); }
    .search-row svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text-light); }
    .cat-filter-row { display: flex; gap: 6px; overflow-x: auto; padding: 10px 14px 0; }
    .cat-filter-row::-webkit-scrollbar { display: none; }
    .cat-chip { flex: 0 0 auto; font-size: 0.68rem; font-weight: 800; color: var(--text-muted); background: var(--bg-primary); border: 1.5px solid transparent; border-radius: var(--radius-full); padding: 5px 12px; cursor: pointer; }
    .cat-chip.is-selected { border-color: currentColor; }

    .place-grid { display: grid; grid-template-columns: 1fr; gap: 10px; padding: 14px; }
    .place-card { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 14px; box-shadow: 0 2px 8px rgba(30,27,46,0.05); }
    .place-tags { display: flex; gap: 4px; margin-bottom: 6px; }
    .place-tag { font-size: 0.6rem; font-weight: 800; padding: 2px 7px; border-radius: var(--radius-full); }
    .place-name { font-weight: 800; font-size: 0.9rem; color: var(--text-main); }
    .place-addr { font-size: 0.72rem; color: var(--text-muted); margin: 3px 0; }
    .place-note { font-size: 0.7rem; color: var(--text-light); }
    .place-meta-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border-subtle); }
    .place-visit-count { font-size: 0.68rem; font-weight: 700; color: var(--brand); }
    .place-last-visit { font-size: 0.66rem; color: var(--text-light); margin-left: auto; }
    .place-map-thumb { width: 100%; height: 90px; border-radius: var(--radius-md); background: linear-gradient(135deg, #E9E5F7, #F3EEFF); margin-bottom: 10px; display: flex; align-items: center; justify-content: center; color: var(--brand); opacity: 0.5; }

    @media (min-width: 768px) {
      .app-shell { max-width: 720px; }
      .place-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (min-width: 1200px) {
      .app-shell { max-width: 1080px; padding: 0 20px; }
      .place-grid { grid-template-columns: 1fr 1fr 1fr; }
    }
  </style>
</helmet>
<div class="app-shell">
  <div class="header">
    <div class="header-row">
      <button class="back-btn" type="button" aria-label="뒤로"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6l6-6"/></svg></button>
      <span class="header-title">장소</span>
      <span class="header-count">등록 3곳</span>
      <div class="header-actions">
        <button class="icon-btn" type="button" aria-label="지도로 보기"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 6v16l7-4 8 4 7-4V2l-7 4-8-4-7 4Z"/><path d="M8 2v16M16 6v16"/></svg></button>
      </div>
    </div>
    <div class="search-row">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input class="search-input" type="text" placeholder="장소 검색" readonly>
    </div>
    <div class="cat-filter-row">
      <button class="cat-chip is-selected" type="button" style="color:var(--text-main)">전체</button>
      <button class="cat-chip" type="button" style="color:#F97316">식당</button>
      <button class="cat-chip" type="button" style="color:#92400E">카페</button>
      <button class="cat-chip" type="button" style="color:#2563EB">놀이</button>
      <button class="cat-chip" type="button" style="color:#7C3AED">숙박</button>
      <button class="cat-chip" type="button" style="color:#64748B">기타</button>
    </div>
  </div>

  <div class="place-grid">
    <div class="place-card">
      <div class="place-map-thumb"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg></div>
      <div class="place-tags"><span class="place-tag" style="background:#FFE4CC; color:#9A3412;">기타</span></div>
      <div class="place-name">천왕산가족캠핑장</div>

      <div class="place-meta-row">
        <span class="place-visit-count">방문 2회</span>
        <span class="place-last-visit">최근 2026.09.19</span>
      </div>
    </div>
    <div class="place-card">
      <div class="place-map-thumb"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg></div>
      <div class="place-tags"><span class="place-tag" style="background:#FFF7ED; color:#9A3412;">식당</span></div>
      <div class="place-name">나눔농장</div>
      <div class="place-addr">경기 부천시 오정구 대장로118</div>
      <div class="place-note">토종닭백숙, 예약 필수</div>
      <div class="place-meta-row">
        <span class="place-visit-count">방문 예정</span>
        <span class="place-last-visit">2026.09.18(금)</span>
      </div>
    </div>
    <div class="place-card">
      <div class="place-map-thumb"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg></div>
      <div class="place-tags"><span class="place-tag" style="background:#DBEAFE; color:#1D4ED8;">놀이</span></div>
      <div class="place-name">연지근린공원 쿠킹클래스</div>
      <div class="place-addr">경기 고양시 일산동구 연지공원로 20</div>
      <div class="place-note">도은·서준 13시 타임 예약</div>
      <div class="place-meta-row">
        <span class="place-visit-count">방문 1회</span>
        <span class="place-last-visit">예정 · 이번주</span>
      </div>
    </div>
  </div>

  <button class="fab" type="button" aria-label="장소 등록"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button>
</div>
</x-dc>
</body>
</html>
