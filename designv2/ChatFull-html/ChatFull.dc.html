<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root {
      --bg-primary: #FAFAFC; --bg-card: #FFFFFF; --border-subtle: #ECEAF5;
      --text-main: #1E1B2E; --text-muted: #6B6580; --text-light: #83798F;
      --brand: #7C3AED; --brand-soft: #F3EEFF;
      --radius-lg: 18px; --radius-md: 12px; --radius-sm: 8px; --radius-full: 9999px;
      --p-yeongwoo: #F87171; --p-yuri: #FB923C; --p-manshik: #34D399; --p-eunhye: #22D3EE;
      --p-doeun: #A78BFA; --p-seojun: #FBBF24;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif; background: var(--bg-primary); }
    button { font-family: inherit; }

    .app-shell { width: 100%; max-width: 480px; margin: 0 auto; background: var(--bg-primary); min-height: 100%; }

    .header {
      position: sticky; top: 0; background: var(--bg-card); z-index: 5; padding: 12px 14px 10px;
      border-bottom: 1px solid var(--border-subtle); display: flex; align-items: center; gap: 8px;
    }
    .back-btn { background: none; border: none; color: var(--text-main); cursor: pointer; padding: 4px; display: inline-flex; }
    .header-title { font-weight: 800; font-size: 0.96rem; color: var(--text-main); }
    .header-sub { font-size: 0.64rem; color: var(--text-light); font-weight: 700; }
    .header-actions { margin-left: auto; display: flex; gap: 4px; }
    .icon-btn { background: none; border: none; color: var(--text-muted); padding: 7px; display: inline-flex; cursor: pointer; border-radius: var(--radius-full); }
    .icon-btn:hover { background: var(--bg-primary); color: var(--brand); }

    /* Date divider -- chats are grouped by day, matching the real room's date pills. */
    .date-divider { text-align: center; padding: 14px 0 10px; }
    .date-divider span { display: inline-block; background: var(--bg-primary); color: var(--text-light); font-size: 0.66rem; font-weight: 700; padding: 4px 12px; border-radius: var(--radius-full); }

    .chat-list { padding: 4px 14px 90px; }
    .chat-row { display: flex; gap: 6px; margin-bottom: 14px; align-items: flex-start; }
    .chat-name-pill { flex-shrink: 0; font-size: 0.62rem; font-weight: 800; color: #fff; padding: 2px 6px; border-radius: var(--radius-full); height: fit-content; margin-top: 1px; }
    .chat-body { min-width: 0; }
    .chat-text { font-size: 0.8rem; color: var(--text-main); line-height: 1.45; background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 0 var(--radius-md) var(--radius-md) var(--radius-md); padding: 8px 11px; display: inline-block; max-width: 260px; }
    .chat-meta-row { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
    .chat-meta { font-size: 0.62rem; color: var(--text-light); }
    .chat-img { margin-top: 4px; width: 130px; height: 174px; border-radius: var(--radius-md); background-size: cover; background-position: center; cursor: pointer; border: none; padding: 0; position: relative; }
    .comment-badge { position: absolute; top: 4px; right: 4px; background: rgba(20,15,35,0.62); color: #fff; font-size: 0.56rem; font-weight: 800; padding: 1px 6px; border-radius: var(--radius-full); }
    .chat-reply-quote {
      display: flex; flex-direction: column; gap: 1px; border-left: 2.5px solid var(--brand); background: var(--brand-soft);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0; padding: 4px 8px; margin-bottom: 4px; max-width: 240px;
    }
    .chat-reply-quote-author { font-size: 0.6rem; font-weight: 800; color: var(--brand); }
    .chat-reply-quote-text { font-size: 0.66rem; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Reused straight from BentoPinkFinal's own gallery-comment-heartbeat -- a photo with an
       unread comment gets the same quiet 두근두근 cue here as it does on the main screen. */
    .gallery-comment-heartbeat { animation: gallery-comment-heartbeat 2.8s ease-in-out infinite; }
    .gallery-comment-heartbeat::before, .gallery-comment-heartbeat::after {
      content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0;
      animation-duration: 2.8s; animation-timing-function: ease-in-out; animation-iteration-count: infinite; animation-delay: inherit;
    }
    .gallery-comment-heartbeat::before { border: 2px solid var(--brand); box-shadow: 0 0 0 1px rgba(124,58,237,0.35); animation-name: gallery-comment-border-flash; }
    .gallery-comment-heartbeat::after { background: #fff; animation-name: gallery-comment-white-flash; }
    @keyframes gallery-comment-heartbeat { 0%,72%,100% { transform: scale(1);} 76%{transform:scale(1.018);} 80%{transform:scale(0.994);} 84%{transform:scale(1.012);} 88%{transform:scale(1);} }
    @keyframes gallery-comment-border-flash { 0%,71%{opacity:0;} 72%{opacity:1;} 80%{opacity:.65;} 90%{opacity:.2;} 100%{opacity:0;} }
    @keyframes gallery-comment-white-flash { 0%,71%{opacity:0;} 72%{opacity:.55;} 75%{opacity:.18;} 78%,100%{opacity:0;} }

    .composer {
      position: fixed; left: 0; right: 0; bottom: 0; max-width: 480px; margin: 0 auto; background: var(--bg-card);
      border-top: 1px solid var(--border-subtle); padding: 10px 12px; display: flex; align-items: center; gap: 8px;
    }
    .composer-attach { background: none; border: none; color: var(--text-muted); padding: 6px; display: inline-flex; cursor: pointer; }
    .composer-input { flex: 1; border: 1px solid var(--border-subtle); border-radius: var(--radius-full); padding: 9px 14px; font-size: 0.8rem; background: var(--bg-primary); color: var(--text-main); }
    .composer-send { background: var(--brand); color: #fff; border: none; border-radius: 50%; width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }

    .side-nav-caption { padding: 10px 14px; font-size: 0.62rem; color: var(--text-light); text-align: center; }

    @media (min-width: 768px) {
      .app-shell { max-width: 640px; }
      .composer { max-width: 640px; }
      .chat-text, .chat-reply-quote { max-width: 340px; }
      .chat-img { width: 150px; height: 200px; }
    }
    @media (min-width: 1200px) {
      .app-shell { max-width: 820px; padding: 0 20px; }
      .composer { max-width: 820px; }
      .header { border-radius: 0; }
    }
  </style>
</helmet>
<div class="app-shell">

  <div class="date-divider"><span>2026년 9월 11일 금요일</span></div>
  <div class="chat-list">
    <div class="chat-row">
      <span class="chat-name-pill" style="background:var(--p-eunhye)">송은혜</span>
      <div class="chat-body">
        <button class="chat-img gallery-comment-heartbeat" type="button" style="background-color:#E9E5F7; animation-delay: 0.9s;" aria-label="사진 크게 보기">
          <span class="comment-badge">2</span>
        </button>
        <div class="chat-meta-row"><span class="chat-meta">15:44:51</span></div>

  <div class="composer">
    <button class="composer-attach" type="button" aria-label="파일 첨부"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.4 11.6 12.9 20a5 5 0 0 1-7-7l8-8a3.5 3.5 0 0 1 5 5l-8 8a2 2 0 0 1-2.8-2.8l7.1-7.1"/></svg></button>

</div>
</x-dc>
</body>
</html>
