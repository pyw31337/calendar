<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root {
      --bg-primary: #FAFAFC; --bg-card: #FFFFFF; --border-subtle: #ECEAF5;
      --text-main: #1E1B2E; --text-muted: #6B6580; --text-light: #83798F;
      --brand: #7C3AED; --brand-soft: #F3EEFF; --status-green: #16A34A; --surface-success: #ECFDF5;
      --radius-lg: 18px; --radius-md: 12px; --radius-sm: 8px; --radius-full: 9999px;
      --p-yeongwoo: #F87171; --p-yuri: #FB923C; --p-manshik: #34D399; --p-eunhye: #22D3EE;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif; background: var(--bg-primary); }
    button, input { font-family: inherit; }

    .app-shell { width: 100%; max-width: 480px; margin: 0 auto; background: var(--bg-primary); min-height: 100%; }
    .header { position: sticky; top: 0; background: var(--bg-card); z-index: 5; padding: 12px 14px 10px; border-bottom: 1px solid var(--border-subtle); display: flex; align-items: center; gap: 8px; }
    .back-btn { background: none; border: none; color: var(--text-main); cursor: pointer; padding: 4px; display: inline-flex; }
    .header-title { font-weight: 800; font-size: 0.96rem; color: var(--text-main); }
    .header-actions { margin-left: auto; display: flex; gap: 4px; }
    .icon-btn { background: none; border: none; color: var(--text-muted); padding: 7px; display: inline-flex; cursor: pointer; border-radius: var(--radius-full); }
    .icon-btn:hover { background: var(--bg-primary); color: var(--brand); }
    .fab { position: fixed; right: 20px; bottom: 24px; width: 52px; height: 52px; border-radius: 50%; background: var(--brand); color: #fff; border: none; box-shadow: 0 8px 20px rgba(124,58,237,0.35); display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 6; }

    .content { padding: 14px; }
    .month-nav { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 14px; }
    .month-nav-btn { background: none; border: none; color: var(--text-muted); padding: 4px; cursor: pointer; display: inline-flex; }
    .month-label { font-weight: 800; font-size: 0.92rem; color: var(--text-main); }

    .settlement-card { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 16px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(30,27,46,0.05); }
    .settlement-card-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
    .settlement-card-title { font-weight: 800; font-size: 0.88rem; color: var(--text-main); }
    .settlement-card-badge { font-size: 0.62rem; font-weight: 800; color: var(--brand); background: var(--brand-soft); padding: 2px 8px; border-radius: var(--radius-full); }
    .settlement-total-row { font-size: 0.72rem; color: var(--text-muted); margin-bottom: 10px; }
    .settlement-total-row b { color: var(--text-main); font-variant-numeric: tabular-nums; }
    .settlement-card-row { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; border-top: 1px solid var(--border-subtle); }
    .settlement-card-row:first-of-type { border-top: none; }
    .settlement-card-row .name-wrap { display: flex; align-items: center; gap: 6px; }
    .settlement-card-row .dot { width: 8px; height: 8px; border-radius: 50%; }
    .settlement-card-row .name { font-weight: 700; font-size: 0.78rem; color: var(--text-main); }
    .settlement-card-row .amt { font-weight: 800; font-size: 0.8rem; font-variant-numeric: tabular-nums; }
    .settlement-card-row .amt.is-refund { color: var(--status-green); }
    .settlement-card-row .amt.is-owe { color: #DC2626; }
    .settlement-share-btn { width: 100%; margin-top: 12px; background: var(--brand-soft); color: var(--brand); font-weight: 800; font-size: 0.76rem; border: none; border-radius: var(--radius-full); padding: 10px; cursor: pointer; }

    .expense-section-label { font-size: 0.66rem; font-weight: 800; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.04em; margin: 18px 0 8px; padding: 0 2px; }
    .expense-row { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); margin-bottom: 6px; }
    .expense-row .cat-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .expense-row-label { font-weight: 700; font-size: 0.78rem; color: var(--text-main); flex: 1; min-width: 0; }
    .expense-row-payer { font-size: 0.64rem; color: var(--text-light); }
    .expense-row-amount { font-weight: 800; font-size: 0.8rem; flex-shrink: 0; font-variant-numeric: tabular-nums; }
    .expense-row-amount.is-expense { color: #DC2626; }
    .expense-row-amount.is-income { color: var(--status-green); }

    @media (min-width: 768px) {
      .app-shell { max-width: 720px; }
    }
    @media (min-width: 1200px) {
      .app-shell { max-width: 1080px; padding: 0 20px; }
      .content { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
      .month-nav { grid-column: 1 / -1; }
    }
  </style>
</helmet>
<div class="app-shell">
  <div class="header">
    <button class="back-btn" type="button" aria-label="뒤로"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6l6-6"/></svg></button>
    <span class="header-title">정산</span>
    <div class="header-actions">
      <button class="icon-btn" type="button" aria-label="공유"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg></button>
    </div>
  </div>

  <div class="content">
    <div class="month-nav">
      <button class="month-nav-btn" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 18-6-6 6-6"/></svg></button>
      <span class="month-label">2026년 9월</span>
      <button class="month-nav-btn" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m9 18 6-6-6-6"/></svg></button>
    </div>

    <div>
      <div class="settlement-card">
        <div class="settlement-card-header">
          <span class="settlement-card-title">천왕산가족캠핑장 캠핑</span>
          <span class="settlement-card-badge">정산 완료</span>
        </div>
        <div class="settlement-total-row">총 지출 <b>184,000원</b> · 4명 분할</div>
        <div class="settlement-card-row"><span class="name-wrap"><span class="dot" style="background:var(--p-yeongwoo)"></span><span class="name">영우</span></span><span class="amt is-owe">-46,000원</span></div>
        <div class="settlement-card-row"><span class="name-wrap"><span class="dot" style="background:var(--p-yuri)"></span><span class="name">유리</span></span><span class="amt is-refund">+8,000원</span></div>
        <div class="settlement-card-row"><span class="name-wrap"><span class="dot" style="background:var(--p-manshik)"></span><span class="name">만식</span></span><span class="amt is-refund">+22,000원</span></div>
        <div class="settlement-card-row"><span class="name-wrap"><span class="dot" style="background:var(--p-eunhye)"></span><span class="name">은혜</span></span><span class="amt is-owe">-46,000원</span></div>
        <button class="settlement-share-btn" type="button">정산 카드 공유</button>
      </div>

      <div class="settlement-card">
        <div class="settlement-card-header">
          <span class="settlement-card-title">정기모임 (10월)</span>
          <span class="settlement-card-badge" style="color:var(--text-muted); background:var(--bg-primary);">진행중</span>
        </div>
        <div class="settlement-total-row">총 지출 <b>36,000원</b> · 4명 분할</div>
        <div class="settlement-card-row"><span class="name-wrap"><span class="dot" style="background:var(--p-yeongwoo)"></span><span class="name">영우</span></span><span class="amt is-refund">+9,000원</span></div>
        <div class="settlement-card-row"><span class="name-wrap"><span class="dot" style="background:var(--p-yuri)"></span><span class="name">유리</span></span><span class="amt is-owe">-9,000원</span></div>
      </div>
    </div>

    <div>
      <div class="expense-section-label">9월 지출 내역</div>
      <div class="expense-row">
        <span class="cat-dot" style="background:#F97316"></span>
        <span class="expense-row-label">캠핑장 이용료</span>
        <span class="expense-row-payer">영우 결제</span>
        <span class="expense-row-amount is-expense">-120,000원</span>
      </div>
      <div class="expense-row">
        <span class="cat-dot" style="background:#3B82F6"></span>
        <span class="expense-row-label">숯·장작</span>
        <span class="expense-row-payer">만식 결제</span>
        <span class="expense-row-amount is-expense">-24,000원</span>
      </div>
      <div class="expense-row">
        <span class="cat-dot" style="background:#10B981"></span>
        <span class="expense-row-label">고속도로 통행료</span>
        <span class="expense-row-payer">공금지출</span>
        <span class="expense-row-amount is-expense">-16,000원</span>
      </div>
      <div class="expense-row">
        <span class="cat-dot" style="background:#8B5CF6"></span>
        <span class="expense-row-label">추가 침낭 2개</span>
        <span class="expense-row-payer">은혜 결제 · 자비부담</span>
        <span class="expense-row-amount is-expense">-24,000원</span>
      </div>
    </div>
  </div>

  <button class="fab" type="button" aria-label="지출 추가"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button>
</div>
</x-dc>
</body>
</html>
