    <title>모여라 캘린더</title>
    <!-- PWA manifest + icons. Previously present only in the legacy root index.html (not the
         Vite entry actually served by dist/), so the deployed site never linked a manifest at
         all -- beforeinstallprompt/"홈 화면에 추가" had no valid installability signal to fire
         on regardless of browser. See copy-static-to-dist.mjs for how manifest*.json/icons/
         reach dist/. No beforeinstallprompt capture script here on purpose: this app has no
         custom install-prompt UI (see PR #236), so Chromium's own default install affordance
         (address-bar icon / mini-infobar) is left to handle itself undisturbed. -->
    <link rel="apple-touch-icon" href="icons/icon-v6-apple-touch.png" />
    <!-- Browser tab only. No large rel="icon" here: Samsung Internet uses the biggest rel="icon"
         for "홈 화면에 추가" instead of the manifest, which put the transparent favicon on the
         home screen. Home-screen icons come from manifest*.json / apple-touch-icon. -->
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-v3-32.png" />
    <!-- 96px transparent M: large enough that mobile browsers (tab strip, history) use it
         instead of borrowing the filled apple-touch/manifest icon, still well below the
         192px they take for a home-screen shortcut. -->
    <link rel="icon" type="image/png" sizes="96x96" href="icons/favicon-v3-96.png" />
    <link rel="icon" href="favicon.ico" />
    <meta name="theme-color" content="#4F46E5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="모여라 캘린더" />
    <script>
      (function () {
        try {
          // V2 is the default shell everywhere now (isRenewalShellEnabled: absent shell param
          // = V2, `?shell=v1` is the escape hatch) -- this script no longer needs to force
          // `shell=v2` itself, and MUST NOT touch the `shell` param at all, or it would silently
          // clobber an explicit `?shell=v1` opt-out on non-github.io hosts. Its only remaining
          // job is defaulting `id` for old bookmarked/shared links on custom domains that predate
          // the `id`/`cal` param. Production github.io / local preview already carry an explicit
          // `id`, so this only ever fires for other hosts.
          var host = String(location.hostname || '');
          if (host === 'pyw31337.github.io' || host === 'localhost' || host === '127.0.0.1' || host === '::1') return;
          var params = new URLSearchParams(location.search);
          var missingId = !params.get('id') && !params.get('cal');
          if (!missingId) return;
          params.set('id', 'cw');
          location.replace(location.pathname + '?' + params.toString() + location.hash);
        } catch (_) {}
      })();
    </script>
    <script>
      // The <link rel="manifest"> tag is created here, in JS, instead of sitting in the HTML
      // source and having its href mutated afterward (the previous approach). That mutation
      // approach measurably failed on a real device: even after confirming the page had fully
      // loaded real per-calendar data and the DOM's manifest link's href correctly read
      // "manifest-cw.json", "홈 화면에 추가" still showed the generic name and a bare URL with no
      // id. The most consistent explanation is WebKit eagerly resolving/caching the manifest
      // tied to whatever href the <link> element had at the moment it was first inserted into
      // the DOM (here, that always used to be the static "manifest.json" in the HTML source),
      // and continuing to use that cached read for "Add to Home Screen" regardless of a later
      // href mutation on the same element. Creating and inserting the element only once the
      // correct per-calendar href is already known removes that wrong initial value entirely --
      // there is no window where a <link rel="manifest"> with the generic href ever exists in
      // the DOM for a calendar-scoped visit.
      //
      // Recognizes both the ?id=/?cal= query-string format and the /share/{calId}/... slash-path
      // format (getCalendarShareUrl in app-utils.js) -- the latter is what this app's own
      // "공유하기"/KakaoTalk share feature hands out, so most first-time visitors arrive via that
      // path, not a ?id= query string.
      //
      // apple-mobile-web-app-title/document.title are also set here, synchronously, rather than
      // only from app-main.js's activeCal effect (which waits for real Firestore data to load) --
      // iOS reads apple-mobile-web-app-title at the moment the share sheet opens.
      (function () {
        var params = new URLSearchParams(window.location.search);
        var id = params.get('id') || params.get('cal');
        var appMatch = window.location.pathname.match(/\/app\/([A-Za-z0-9_-]+)\/?$/);
        if (!id && appMatch) {
          id = appMatch[1];
          params.set('id', id);
          try { history.replaceState(history.state, '', window.location.pathname + '?' + params.toString() + window.location.hash); } catch (_) {}
        }
        if (!id) {
          var shareMatch = window.location.pathname.match(/\/share\/([A-Za-z0-9_-]+)/);
          if (shareMatch) id = shareMatch[1];
        }
        var manifestByCalendar = { kkot: 'manifest-kkot.json', cw: 'manifest-cw.json', jhair: 'manifest-jhair.json' };
        // Per-calendar install scope. Every manifest used to share scope "./" (/calendar/), so on
        // Android (Chrome/Samsung Internet/Whale) the first installed calendar claimed every
        // /calendar/ URL: visiting ?id=cw offered "open 제이헤어" instead of installing 모아엘가.
        // Each calendar now lives under its own path, /calendar/app/<id>/ (a copy of this page
        // with <base href="../../">, written by copy-static-to-dist.mjs), and its manifest's scope
        // is that path. A root visit is moved there in place -- a <base> keeps relative URLs on the
        // root, then replaceState swaps the address; no reload. Only when the build shipped the
        // app/ copies (the meta below), so vite dev and older deploys are left alone.
        var hasAppPaths = !!document.querySelector('meta[name="gather-app-paths"]');
        if (hasAppPaths && id && manifestByCalendar[id] && !appMatch && window.top === window
          && !/\/share\//.test(window.location.pathname) && !params.has('admin') && params.get('mode') !== 'admin') {
          var rootPath = window.location.pathname.replace(/[^/]*$/, '');
          try {
            if (!document.querySelector('base')) {
              var baseEl = document.createElement('base');
              baseEl.setAttribute('href', rootPath);
              document.head.insertBefore(baseEl, document.head.firstChild);
            }
            history.replaceState(history.state, '', rootPath + 'app/' + id + '/' + window.location.search + window.location.hash);
          } catch (_) {}
        }
        var titleByCalendar = { kkot: '꽃잎반', cw: '모아엘가', jhair: '제이헤어' };
        var manifestHref = (id && manifestByCalendar[id]) || 'manifest.json';
        var link = document.createElement('link');
        link.setAttribute('rel', 'manifest');
        link.setAttribute('href', manifestHref);
        document.head.appendChild(link);
        if (id && titleByCalendar[id]) {
          var appleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
          if (appleTitle) appleTitle.setAttribute('content', titleByCalendar[id]);
          // No " 캘린더" suffix -- iOS's "홈 화면에 추가" pre-fills its editable name field from
          // document.title, and whatever is in that field at "추가" time becomes the installed
          // icon's permanent label (see the matching note in app-main.js's activeCal effect).
          document.title = titleByCalendar[id];
        }
      })();
    </script>
    <!-- Pretendard: the V2 font stack (design.css --font-sans) names it first, but it was never
         loaded -- Mac/iOS then took line metrics from SF while drawing Hangul in Noto Sans KR, so
         Korean text sat visibly high in every fixed-height badge/pill/field. Dynamic subset: the
         browser downloads only the unicode-range chunks a page actually uses. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet" />
    <!-- Same-origin Firebase SDK preload. main.jsx skips these when they are already ready, so
         mobile browsers do not depend on a third-party CDN or duplicate the SDK scripts. -->
    <script  src="vendor/firebase-app-compat.js?v=20260903-sdk-10-14-1" defer></script>
    <script  src="vendor/firebase-firestore-compat.js?v=20260903-sdk-10-14-1" defer></script>
    <!-- Firebase SDK scripts are loaded from main.jsx (loadFirebaseSdk), vendored under
         vendor/ (same origin) instead of from www.gstatic.com -- a real device consistently got
         `window.firebase undefined` even after every retry/timeout adjustment tried, tracing back
         to something on that network path blocking www.gstatic.com specifically while the site's
         own origin loaded fine. See main.jsx for the loader. -->
    <!-- async, not a plain blocking <script src> (and not defer -- defer scripts still execute in
         document order among the "list of scripts to execute in order" that module scripts belong
         to as well, so a defer script placed here would still make <script type="module"
         src="/main.jsx"> at the bottom of <body> wait for it to finish downloading before running,
         same blocking problem one step removed; measured directly with this app's own boot-ready
         flag). async scripts run independently the moment they're ready, entirely outside that
         ordering, so they can never delay main.jsx. These three are also non-critical (confetti
         effect, lunar-calendar date conversion, QR code generation; every call site already
         guards for the library not being loaded yet), so nothing here needs them before first
         paint or before the app boots -- if jsdelivr.net is ever slow or unreachable for a
         visitor, that no longer holds up Firebase SDK loading or anything else. -->
    <script async src="https://cdn.jsdelivr.net/npm/korean-lunar-calendar/dist/korean-lunar-calendar.min.js"></script>
    <script async src="https://cdn.jsdelivr.net/npm/qrcode-generator@2.0.4/dist/qrcode.js"></script>
