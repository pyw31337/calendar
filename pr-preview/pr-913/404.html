<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>렛츠 캘린더</title>
  <script>
    (function () {
      var loc = window.location;
      var path = loc.pathname || '';
      var search = loc.search || '';
      var hash = loc.hash || '';

      // Match /share/{calendarId}/{view}/{memoId} or /share/{calendarId}/{view} or /share/{calendarId}
      var shareMatch = path.match(/\/share\/([A-Za-z0-9_-]+)(?:\/([A-Za-z0-9_-]+))?(?:\/([A-Za-z0-9_.-]+))?\/?$/);
      if (shareMatch) {
        var calendarId = shareMatch[1];
        var view = shareMatch[2] || '';
        var extraId = shareMatch[3] || '';

        var target = '/calendar/?id=' + encodeURIComponent(calendarId);
        if (view === 'memo') {
          target += '&view=memo';
          if (extraId) target += '&memo=' + encodeURIComponent(extraId);
        } else if (view && ['chat', 'places', 'gallery', 'settlement'].indexOf(view) !== -1) {
          target += '&view=' + encodeURIComponent(view);
          if (extraId) target += '&detail=' + encodeURIComponent(extraId);
        } else if (view) {
          target += '&view=' + encodeURIComponent(view);
        }

        if (search) {
          var params = new URLSearchParams(search);
          params.delete('id');
          params.delete('cal');
          params.delete('view');
          if (view === 'memo') params.delete('memo');
          var remainder = params.toString();
          if (remainder) target += '&' + remainder;
        }

        loc.replace(target + hash);
        return;
      }

      // An unknown page under a calendar (/calendar/app/<id>/<page>/ that this build does not
      // publish): open that calendar instead of the site root. Only a deeper path redirects, so a
      // missing /app/<id>/ itself still falls through below and can never loop.
      var appMatch = path.match(/^(.*\/)app\/([A-Za-z0-9_-]+)\/.+$/);
      if (appMatch) {
        loc.replace(appMatch[1] + 'app/' + appMatch[2] + '/' + search + hash);
        return;
      }

      // Fallback for any other 404 on GitHub Pages
      var base = path.indexOf('/calendar/') !== -1 ? '/calendar/' : '/';
      loc.replace(base + search + hash);
    })();
  </script>
</head>
<body style="font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; color: #64748B;">
  <p>렛츠 캘린더로 이동 중…</p>
</body>
</html>
