  <script id="pwa-manifest-switch">
    // The <link rel="manifest"> tag is created here, in JS, instead of sitting in the HTML
    // source with a generic href that later gets mutated (the previous approach, mirrored from
    // src/index.html). That mutation approach measurably failed on a real device -- confirmed
    // the page had fully loaded real per-calendar data and the DOM's manifest link's href
    // correctly read "manifest-cw.json", yet "홈 화면에 추가" still showed the generic name and
    // a bare URL with no id. The most consistent explanation is WebKit eagerly resolving/
    // caching the manifest tied to whatever href the <link> element had at the moment it was
    // first inserted into the DOM (previously always the static generic href in the HTML
    // source), and continuing to use that cached read for "Add to Home Screen" regardless of a
    // later href mutation on the same element. Creating and inserting the element only once the
    // correct per-calendar href is already known removes that wrong initial value entirely.
    //
    // Recognizes both the ?id=/?cal= query-string format and the /share/{calId}/... slash-path
    // format (getCalendarShareUrl in app-utils.js) -- the latter is this app's own
    // "공유하기"/KakaoTalk share feature's URL, so most first-time visits arrive via that path.
    //
    // apple-mobile-web-app-title/document.title are also set here, synchronously, since iOS
    // reads apple-mobile-web-app-title at the moment the share sheet opens, not after real
    // Firestore data has loaded.
    (function () {
      var params = new URLSearchParams(window.location.search);
      var id = params.get('id') || params.get('cal');
      if (!id) {
        var shareMatch = window.location.pathname.match(/\/share\/([A-Za-z0-9_-]+)/);
        if (shareMatch) id = shareMatch[1];
      }
      var manifestByCalendar = { kkot: 'manifest-kkot.json', cw: 'manifest-cw.json', jhair: 'manifest-jhair.json' };
      var titleByCalendar = { kkot: '꽃잎반', cw: '모아엘가', jhair: '제이헤어' };
      var manifestHref = (id && manifestByCalendar[id]) || 'manifest.json';
      var link = document.createElement('link');
      link.setAttribute('rel', 'manifest');
      link.setAttribute('href', manifestHref);
      document.head.appendChild(link);
      if (id && titleByCalendar[id]) {
        var appleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
        if (appleTitle) appleTitle.setAttribute('content', titleByCalendar[id]);
        // No " 캘린더" suffix -- iOS's "홈 화면에 추가" pre-fills its editable name field from
        // document.title, and whatever is in that field at "추가" time becomes the installed
        // icon's permanent label (see the matching note in app-main.js's activeCal effect).
        document.title = titleByCalendar[id];
      }
    })();
  </script>
  <script id="pwa-install-capture">
    // Captures beforeinstallprompt (Chromium only -- Safari/Firefox never fire it) as early as
    // physically possible. The main app script sits well below this, after the Firebase/React
    // CDN <script src> tags and the rest of <head>, all of which have to download and run
    // first -- easily enough time on a slow connection for Chrome to finish evaluating
    // installability and fire the event before a listener attached down there would exist to
    // catch it. A listener never catches an event that fired before it was attached, so a late
    // listener silently means "홈 화면에 바로가기" always falls through to the manual
    // instructions even on a fully installable Chromium browser. Stashed on window (not a
    // local variable) so the main app script can read it once it loads.
    window.__deferredInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.__deferredInstallPrompt = e;
    });
  </script>
  <script id="theme-init">
    // Always stamp data-theme=light|dark before paint. Never leave unset
    // (side-menu-only dark bug on Samsung Internet / system theme).
    (function () {
      try {
        var params = new URLSearchParams(window.location.search);
        if (params.get('admin') === '1') {
          document.documentElement.setAttribute('data-theme', 'light');
          return;
        }
        var id = params.get('id') || params.get('cal') || '';
        var saved = id ? (window['local' + 'Storage'].getItem('gather_theme_preference_' + id + '_v1') || '') : '';
        var resolved = saved;
        if (resolved !== 'dark' && resolved !== 'light') {
          resolved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', resolved);
      } catch (e) {
        try { document.documentElement.setAttribute('data-theme', 'light'); } catch (_) {}
      }
    })();
  </script>
