  <!-- Home screen / desktop shortcut icon + PWA manifest -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <script id="pwa-manifest-switch">
    // Point the manifest at a per-calendar variant (start_url baked in) so that installing
    // the app while viewing ?id=kkot or ?id=cw launches back into that same calendar --
    // manifest.json's own start_url has no query string, so without this every installed
    // shortcut would silently open kkot regardless of which calendar was on screen at
    // install time. Kept as a standalone inline script (not part of the main app bundle)
    // so it still runs even if the app script itself fails to load.
    (function () {
      var params = new URLSearchParams(window.location.search);
      var id = params.get('id') || params.get('cal');
      var manifestByCalendar = { kkot: 'manifest-kkot.json', cw: 'manifest-cw.json' };
      if (id && manifestByCalendar[id]) {
        var link = document.querySelector('link[rel="manifest"]');
        if (link) link.setAttribute('href', manifestByCalendar[id]);
      }
    })();
  </script>
  <script id="pwa-install-capture">
    // Captures beforeinstallprompt (Chromium only -- Safari/Firefox never fire it) as early as
    // physically possible. The main app script sits well below this, after the Firebase/React
    // CDN <script src> tags and the rest of <head>, all of which have to download and run
    // first -- easily enough time on a slow connection for Chrome to finish evaluating
    // installability and fire the event before a listener attached down there would exist to
    // catch it. A listener never catches an event that fired before it was attached, so a late
    // listener silently means "홈 화면에 바로가기" always falls through to the manual
    // instructions even on a fully installable Chromium browser. Stashed on window (not a
    // local variable) so the main app script can read it once it loads.
    window.__deferredInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.__deferredInstallPrompt = e;
    });
  </script>
  <script id="theme-init">
    // Applies the user's saved theme choice for THIS calendar (if any) before first paint, so
    // the page never flashes the wrong theme -- with no saved choice, the CSS's own
    // prefers-color-scheme:dark rule (see :root in the <style> block) decides instead. Dark
    // mode is a per-calendar preference (see the 일반 tab in settings), so the storage key is
    // scoped by the ?id=/?cal= URL param the same way pwa-manifest-switch above resolves it --
    // isAllowedCalendarId() itself isn't defined yet this early, so this only needs the id to
    // pick the right localStorage key, not to fully validate it.
    (function () {
      try {
        var params = new URLSearchParams(window.location.search);
        var id = params.get('id') || params.get('cal') || 'kkot';
        var saved = window['local' + 'Storage'].getItem('gather_theme_preference_global_v1') || window['local' + 'Storage'].getItem('gather_theme_preference_' + id + '_v1');
        if (saved === 'dark' || saved === 'light') {
          document.documentElement.setAttribute('data-theme', saved);
        }
      } catch (e) {}
    })();
  </script>

  <!-- Google Fonts -->

  <!-- Warm up the CDN connections Firebase/React/confetti etc. need (DNS + TLS ahead of time)
       so the actual script fetches below don't each pay that setup cost serially. -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

  <!-- Firebase SDK for Realtime Multi-User Firestore Sync. `defer` (not left blocking) --
       these sit in <head>, ABOVE the loading skeleton markup in <body> below, so without defer
       the browser can't paint anything at all, not even that skeleton, until all three finish
       downloading AND executing (~400KB combined) -- the exact opposite of what the skeleton
       exists for. `defer` lets the browser paint the skeleton immediately while these download
       in the background, then run them (still in this exact order, before the body scripts
       below) once parsing finishes. The app's own data-loading logic already awaits
       firebase.apps.length/firebaseDb being ready, so nothing here depends on these executing
       synchronously during head-parse. -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js" defer></script>

  <!-- Confetti/lunar calendar/QR code are only used from user-triggered interactions or after
       async data has loaded (never at initial script-parse time -- see the typeof guards around
       their call sites), so `defer` lets them fetch in the background instead of delaying
       Firebase/React, which are on the critical path to first render. -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/korean-lunar-calendar/dist/korean-lunar-calendar.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@2.0.4/dist/qrcode.js" defer></script>

      <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
    </div>

  <!-- Ultra-Fast Cloudflare cdnjs CDN for React 18 & ReactDOM 18. `defer` on all of these
       (matching the Firebase SDK scripts in <head> above) lets the browser fetch this entire
       chain in parallel from the moment it first parses the HTML, instead of only starting each
       download after the previous script has finished executing -- execution still happens in
       this exact document order (defer guarantees that), so nothing about load sequencing
       changes, only how much of it can overlap. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" crossorigin defer></script>
